<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="bg-img">
        <div class="logo-bg">
          <img src="./Assets/odin-lined.png" alt="odin-logo" />
          <h1>ODIN</h1>
        </div>
        <p>
          Photo by
          <a
            href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Halie West</a
          >
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </p>
      </div>

      <div class="bg-color">
        <div>
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <span>now</span> to get started.
          </p>

          <p>You <span>know</span> you want to.</p>
        </div>

        <form action="" method="post">
          <div class="form-bg">
            <h2>Let's do this!</h2>

            <label for="first-name">FIRST NAME</label>
            <input type="text" name="first-name" id="first-name" />

            <label for="last-name">LAST NAME</label>
            <input type="text" name="last-name" id="last-name" />

            <label for="email">EMAIL</label>
            <input type="email" name="email" id="email" />

            <label for="phone-number">PHONE NUMBER</label>
            <input type="number" name="phone-number" id="phone-number" />

            <label for="password">PASSWORD</label>
            <input type="password" name="password" id="password" min="6" />

            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input
              type="password"
              name="confirm-password"
              id="confirm-password"
              min="6"
            />
          </div>

          <button type="submit">Create Account</button>
          <p>Already have an account? <a href="#">Login</a></p>
        </form>
      </div>
    </main>
  </body>
</html>
